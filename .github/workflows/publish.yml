name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write  # Trusted Publishing (OIDC)
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.11"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen --group dev --all-extras

    - name: Run tests
      run: uv run pytest --cov=pods --cov-report=xml

    - name: Check version matches release tag
      run: |
        RELEASE_VERSION=${GITHUB_REF#refs/tags/v}
        PROJECT_VERSION=$(uv version --short)
        if [ "$RELEASE_VERSION" != "$PROJECT_VERSION" ]; then
          echo "Error: Release version $RELEASE_VERSION doesn't match project version $PROJECT_VERSION"
          exit 1
        fi
        echo "Version check passed: $RELEASE_VERSION"

    - name: Build package
      run: uv build

    - name: Publish to PyPI
      env:
        # Fallback if Trusted Publishing is not configured on PyPI.
        # Prefer OIDC (id-token: write + environment: release).
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      run: uv publish

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
