[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pods"
version = "0.1.19"
description = "Python software for Open Data Science"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Neil D. Lawrence", email = "lawrennd@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "PyYAML",
    "scipy",
    "numpy>=1.26",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Homepage = "https://github.com/lawrennd/ods"
Repository = "https://github.com/lawrennd/ods"

[project.optional-dependencies]
hdf5-compatibility = ["h5py"]
google-trends-interface = ["pytrends"]
nigerian-nmis-data = ["geopandas"]
kepler-telescope-light-curves = ["astropy"]
olivetti-faces = ["netpbmfile"]
gpx-data = ["gpxpy"]
excel-files = ["openpyxl"]
all-datasets = [
    "h5py",
    "pytrends",
    "geopandas",
    "astropy",
    "netpbmfile",
    "gpxpy",
    "openpyxl",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "mock",
]

[tool.hatch.build.targets.wheel]
packages = ["pods"]

[tool.hatch.build.targets.wheel.force-include]
"pods/defaults.cfg" = "pods/defaults.cfg"
"pods/data_resources.json" = "pods/data_resources.json"
"pods/football_teams.json" = "pods/football_teams.json"

[tool.hatch.build.targets.sdist]
include = [
    "/pods",
    "/README.md",
    "/LICENSE.txt",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["pods/testing"]
python_files = ["*_tests.py", "test_*.py"]
python_classes = ["*Tests", "Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
